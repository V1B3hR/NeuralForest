name: CPU Training - NeuralForest

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: true
        default: '200'
        type: string
      batch_size:
        description: 'Batch size (smaller = faster on CPU)'
        required: true
        default: '16'
        type: string
      checkpoint_every:
        description: 'Save checkpoint every N epochs'
        required: true
        default: '20'
        type: string
      max_trees:
        description: 'Maximum number of trees'
        required: true
        default: '70'
        type: string
  push:
    branches: [main]
    paths:
      - 'training_demos/**'
      - '.github/workflows/cpu_training.yml'

env:
  PYTHON_VERSION: '3.10'
  PYTORCH_VERSION: '2.1.0'

jobs:
  train-cpu-full:
    name: CPU Training (CIFAR-10 Full)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install PyTorch and torchvision (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==${{ env.PYTORCH_VERSION }} torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml
      - name: Run CPU Training
        id: training
        run: |
          EPOCHS=${{ github.event.inputs.epochs }}
          BATCH_SIZE=${{ github.event.inputs.batch_size }}
          CHECKPOINT_EVERY=${{ github.event.inputs.checkpoint_every }}
          MAX_TREES=${{ github.event.inputs.max_trees }}

          echo "Starting training: $EPOCHS epochs, batch size $BATCH_SIZE, max_trees=$MAX_TREES"
          mkdir -p training_demos/results/cpu_training_${EPOCHS}ep/checkpoints

          python training_demos/cifar10_full_training.py \
            --epochs $EPOCHS \
            --batch_size $BATCH_SIZE \
            --checkpoint_every $CHECKPOINT_EVERY \
            --max_trees $MAX_TREES \
            --device cpu \
            --output_dir training_demos/results/cpu_training_${EPOCHS}ep
      - name: Training summary
        if: always()
        run: |
          EPOCHS=${{ github.event.inputs.epochs }}
          REPORT_PATH="training_demos/results/cpu_training_${EPOCHS}ep/final_report.md"
          if [ -f "$REPORT_PATH" ]; then
            echo "## Training Summary" >> $GITHUB_STEP_SUMMARY
            cat "$REPORT_PATH" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Training report not found at $REPORT_PATH" >> $GITHUB_STEP_SUMMARY
      - name: Upload metrics and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-training-metrics-${{ github.event.inputs.epochs }}ep
          path: |
            training_demos/results/cpu_training_${{ github.event.inputs.epochs }}ep/metrics.json
            training_demos/results/cpu_training_${{ github.event.inputs.epochs }}ep/learning_curves.png
            training_demos/results/cpu_training_${{ github.event.inputs.epochs }}ep/final_report.md
